# HTTP → HTTPS (wszystkie domeny)
server {
    listen 80;
    server_name kzelman.pl www.kzelman.pl magazyn.kzelman.pl;
    return 301 https://$host$request_uri;
}

# Frontend dla kzelman.pl
server {
    listen 443 ssl;
    server_name kzelman.pl www.kzelman.pl;

    root /var/www/kzelman/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Tenant-Id "";
    }

    location /actuator/ {
        proxy_pass http://localhost:8080/actuator/;
        proxy_set_header Host $host;
    }

    ssl_certificate /etc/letsencrypt/live/kzelman.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kzelman.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Backend dla api.kzelman.pl
server {
    listen 443 ssl;
    server_name api.kzelman.pl;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ssl_certificate /etc/letsencrypt/live/kzelman.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kzelman.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name api.kzelman.pl;
    return 301 https://$host$request_uri;
}

# Frontend dla magazyn.kzelman.pl
server {
    listen 443 ssl;
    server_name magazyn.kzelman.pl;

    root /var/www/kzelman/dist;
    index index.html;

    # Nagłówki dla skanera kamery (wymagane na stronie głównej SPA)
    # HTML: always validate with server (no-cache) — zapobiega przestarzałym bundle'om
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # Statyczne assety z hashem: długi cache (zmiana nazwy pliku = nowa wersja)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Tenant-Id "";
    }

    location /actuator/ {
        proxy_pass http://localhost:8080/actuator/;
        proxy_set_header Host $host;
    }

    ssl_certificate /etc/letsencrypt/live/kzelman.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kzelman.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name magazyn.kzelman.pl;
    return 301 https://$host$request_uri;
}
