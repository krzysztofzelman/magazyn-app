name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: REMOVED
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2022
          script: |
            cd /var/www/magazyn-app
            git remote set-url origin https://${{ secrets.PAT_TOKEN }}@github.com/krzysztofzelman/magazyn-app.git
            git pull
            mvn clean package -DskipTests
            systemctl restart magazyn