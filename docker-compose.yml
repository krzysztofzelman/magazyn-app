version: '3.8'

services:
  postgres:
    image: postgres:18
    container_name: magazyn-postgres
    environment:
      POSTGRES_DB: magazyn_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - magazyn-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d magazyn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: magazyn-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/magazyn_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
    networks:
      - magazyn-net
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    image: postgres:18
    container_name: magazyn-backup
    environment:
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      PGHOST: postgres
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh
      - ./backups:/backups
    entrypoint:
      - /bin/bash
      - -c
      - |
        chmod +x /usr/local/bin/backup.sh
        while true; do
          /usr/local/bin/backup.sh
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - magazyn-net
    restart: unless-stopped

networks:
  magazyn-net:
    driver: bridge

volumes:
  postgres_data:
