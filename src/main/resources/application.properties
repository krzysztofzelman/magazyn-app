spring.application.name=magazyn
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

# Refresh token — 7 days (604800000 ms)
jwt.refresh-expiration=604800000

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs
springdoc.packages-to-scan=com.example.magazyn.controller
logging.level.org.springdoc=WARN

# App logging
logging.level.com.example.magazyn=INFO
logging.level.org.springframework.web=INFO

# HikariCP connection pool
spring.datasource.hikari.maximumPoolSize=10
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.idleTimeout=300000
spring.datasource.hikari.connectionTimeout=20000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# App info
info.app.name=Magazyn App
info.app.version=1.0.0
info.app.description=System zarz\u0105dzania magazynem

# Mail
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:noreply@magazyn.local}

# Notifications
notifications.enabled=${NOTIFICATIONS_ENABLED:false}
notifications.expiry-warning-days=14
notifications.cron=0 0 7 * * *

# AI Assistant (DeepSeek)
assistant.api-key=${DEEPSEEK_API_KEY:}
assistant.model=${ASSISTANT_MODEL:deepseek-chat}
assistant.api-url=${ASSISTANT_API_URL:https://api.deepseek.com}

# ============================================================
# KSeF Configuration (Krajowy System e-Faktur)
# ============================================================
ksef.api.url=${KSEF_API_URL:https://ksef-test.mf.gov.pl/api/v1}
ksef.api.key=${KSEF_API_KEY:}
ksef.nip=${COMPANY_NIP:}
ksef.connection.timeout=30000
ksef.read.timeout=30000
ksef.retry.max-attempts=3
ksef.retry.delay=1000
ksef.retry.multiplier=2.0
ksef.encryption.key=${KSEF_ENCRYPTION_KEY:}
ksef.encryption.algorithm=AES/GCM/NoPadding
ksef.audit.enabled=true
ksef.audit.retention-days=90
